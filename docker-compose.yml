# 生产/部署编排：app + postgres + 可选 redis/nginx
# 用法：docker compose up -d [--scale app=N]；可选服务：docker compose --profile cache --profile proxy up -d
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:14-alpine
    container_name: issuests-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: issuests-redis-prod
    restart: unless-stopped
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: issuests-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  uploads:
