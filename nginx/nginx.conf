upstream issuests_app {
    least_conn;
    server app:3000 max_fails=3 fail_timeout=10s;   # 多副本: server app2:3000; ... 或 docker DNS 轮询
}

server {
    listen 80;
    server_name _;

    # 静态资源（Vue 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 app（多副本负载）
    location /api/ {
        proxy_pass http://issuests_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 上传的图片
    location /uploads/ {
        proxy_pass http://issuests_app;
        proxy_set_header Host $host;
    }
}
